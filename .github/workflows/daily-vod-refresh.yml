name: Daily VOD Refresh

on:
  schedule:
    # 08:00 Asia/Seoul = 23:00 UTC on the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Asia/Seoul target date (YYYY-MM-DD)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-vod-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KURO_API_KEY: ${{ secrets.KURO_API_KEY }}
      KURO_BASE_URL: ${{ secrets.KURO_BASE_URL }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_SPREADSHEET_TOKEN: V9C1sSLU4hOweEtvDRdcBnENnMh
      FEISHU_AD_SHEET_ID: 0GfgFb
      FEISHU_AD_RANGE: B:K
      AD_TASK_DATA_URL: https://api.github.com/repos/krksw96/wuthering-waves-kol-dashboard/contents/data/ad-task-video-ids.json?ref=main
      TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh VOD data
        run: node scripts/daily-refresh.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ad-videos.json data/videos.js data/youtube-update-*.json index.html
          git commit -m "Daily VOD refresh $(date -u +%Y-%m-%d)"
          git push origin main
