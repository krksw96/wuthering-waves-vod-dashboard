name: Zenless August Backfill

on:
  schedule:
    # Run once after the YouTube API daily search quota resets (17:05 KST, 2026-08-13).
    - cron: "5 8 13 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect and apply August Zenless data
        run: node scripts/backfill-zenless-august.mjs
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zenless-zone-zero.js data/zenless-youtube-update-*.json dashboard.html
          git commit -m "Backfill Zenless August YouTube data"
          git push origin main
